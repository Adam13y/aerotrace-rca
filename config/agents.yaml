# AeroTrace-RCA agent configuration.
# Times are mission-elapsed seconds (MET) relative to the first sample in the dataset.

pipeline:
  max_retries: 3
  retry_base_delay_seconds: 1.5
  use_llm: true

telemetry_analyst:
  correlation_window_seconds: 5.0
  flight_phases:
    - { name: "Liftoff & initial ascent", start: 0, end: 55 }
    - { name: "Throttle bucket / Max-Q", start: 55, end: 83 }
    - { name: "Mid-burn ascent", start: 83, end: 200 }
    - { name: "Late burn", start: 200, end: 283 }
    - { name: "Engine cutoff", start: 283, end: 1.0e9 }

anomaly_detector:
  provider_preference: local        # local = Ollama first, Claude as fallback
  llm_temperature: 0.0              # deterministic triage
  onset_backtrack: true             # report when a deviation began, not when it was first flagged
  onset_threshold_sigma: 3.0
  startup_ignore_seconds: 5.0       # anomalies first detected before T+5s are suppressed (and logged)
  recovery_window_seconds: 10.0     # transient = back within 1 sigma of baseline within this time of onset
  # Minimum severity for large relative changes (first matching sensor pattern wins; not applied to planned events).
  severity_floors:
    - {pattern: "*pressure*", min_change_pct: 5, severity: WARNING}
    - {pattern: "*temp*", min_change_pct: 10, severity: WARNING}
    - {pattern: "*vib*", min_change_pct: 20, severity: WARNING}
    - {pattern: "*voltage*", min_change_pct: 3, severity: WARNING}
  window_seconds: 10.0
  zscore_threshold: 5.0             # robust z of residual vs. rolling median trend
  derivative_threshold: 6.0         # robust z of the first time derivative
  moving_average_threshold: 6.0     # deviation from trailing moving average (in sigma)
  info_score: 5.5
  warning_score: 8.0
  critical_score: 14.0
  merge_gap_seconds: 2.0
  min_points: 20
  max_readings_per_event: 40
  # Hard engineering limits. Any breach is CRITICAL.
  sensor_limits:
    avionics_bus_voltage: { low: 26.5, high: 30.0 }
    engine_bay_temp: { low: -40.0, high: 200.0 }
  # Planned transients: overlapping detections are downgraded to INFO and marked expected.
  planned_events:
    - { name: "Engine start / liftoff", start: 0, end: 6, sensors: ["chamber_pressure", "turbopump_vibration", "engine_bay_temp"] }
    - { name: "Throttle down", start: 54, end: 61, sensors: ["chamber_pressure", "turbopump_vibration"] }
    - { name: "Throttle up", start: 77, end: 84, sensors: ["chamber_pressure", "turbopump_vibration"] }
    - { name: "Main engine cutoff (MECO)", start: 282, end: 300, sensors: ["*"] }

sensor_fault_classifier:
  max_spike_samples: 1           # <= this many consecutive over-threshold samples ...
  recovery_window_s: 1.0         # ... and back at baseline within this window -> sensor_fault
  recovery_ratio: 0.25           # "back at baseline" = median post-spike deviation <= 25% of the spike
  min_real_event_samples: 4      # > 3 consecutive over-threshold samples -> real_event

hypothesis_generator:
  provider_preference: cloud        # cloud = Claude first, Ollama as fallback
  max_hypotheses: 6
  knowledge_base_matches: 3
  temperature: 0.0                  # deterministic hypotheses (Ollama also uses a fixed seed)
  coverage_retries: 2               # follow-ups per unexplained anomaly: 1 = focused (+independence), 2 = single-cause
  unresolved_placeholders: true     # if all follow-ups fail: "Unresolved ... manual review" placeholder
  historical_cases: 5               # RAG: knowledge-base cases injected into the prompt
  min_competing_hypotheses: 2       # distinct explanations required for the leading correlated group
  alternative_retries: 0            # 0 = report a shortfall instead of asking the LLM again
  evidence_rules:
    unobservable_confidence_cap: 0.3  # subsystems/components the vehicle has no sensor for
    inferred_confidence_cap: 0.5      # local components without a dedicated sensor (allow_inferred)
    # Component-level evidence (checked first, on the title + primary cause sentence only).
    # requires = AND of OR-groups of sensor names (glob patterns allowed).
    components:
      turbopump_cavitation:
        subsystem: propulsion
        terms: ["cavitat*"]
        requires: [[turbopump_vibration], [lox_tank_pressure, fuel_tank_pressure]]
      combustion_instability:
        subsystem: propulsion
        terms: ["combustion instabilit*", "combustion oscillat*", chugging, "screech*"]
        requires: [[chamber_pressure]]
      thermal_failure:
        subsystem: thermal
        terms: [thermal control, thermal failure, "overheat*", insulation, heat soak, cooling failure]
        requires: [[engine_bay_temp]]
      electrical_failure:
        subsystem: electrical
        terms: [battery, batteries, cell, under-voltage, undervoltage, brownout, short circuit, short-circuit,
                load transient, power distribution]
        requires: [[avionics_bus_voltage]]
      camera_failure:
        subsystem: avionics
        terms: [camera]
        requires: [["camera_*"]]       # e.g. camera_status or camera_frame_rate_hz
        allow_inferred: true           # no camera sensor -> local_component_inferred, capped at 50%
    # Mechanism keywords per subsystem. After a component match, mechanisms from OTHER subsystems in the
    # title/primary cause make it a cross-subsystem hypothesis that needs evidence from both subsystems.
    # A term listed under several subsystems ("hot gas") needs evidence from each of them.
    mechanism_terms:
      propulsion: [plume, combustion, thrust, "cavitat*", injector, turbopump, nozzle, gas generator,
                   regenerative cooling, hot gas, hot-gas]
      thermal: [radiative, convective, "ablat*", hot gas, hot-gas, heat soak, insulation]
      pressurization: [regulator, helium, copv, ullage, pressurant, relief valve, vent valve]
      electrical: [short circuit, short-circuit, battery, brownout, emi, under-voltage, undervoltage, power distribution]
      avionics: [software, imu, guidance, gps, flight computer, star tracker]
      structural: ["crack*", fatigue, strut, "buckl*", "fractur*"]
      aerodynamic: ["buffet*", flutter, wind shear, "aerodynamic*"]
      separation: ["pyrotechnic*", pyro, separation]
    # Phrases that name a subsystem as (part of) a cause. "*" = any word ending.
    subsystem_terms:
      propulsion: [turbopump, turbo pump, pump cavitation, "cavitat*", combustion, injector, nozzle, gas generator,
                   thrust, engine, chamber, propellant feed, feed line, feed system, inlet pressure, npsh, npsp,
                   hot gas, hot-gas, plume, regenerative cooling, mixture ratio, igniter, ignition, preburner]
      pressurization: ["pressuris*", "pressuriz*", pressurant, regulator, helium, copv, ullage, relief valve,
                       vent valve, "overpressur*", "over-pressur*"]
      thermal: [thermal, "overheat*", heat soak, heating, insulation, thermal protection, tps, cooling failure, heat leak]
      electrical: [electrical, avionics bus, power bus, voltage, under-voltage, undervoltage, brownout, battery,
                   batteries, cell, short circuit, short-circuit, power distribution, power supply, load transient,
                   relay, wiring, harness, bus, emi]
      avionics: [avionics, imu, inertial, gps, flight computer, guidance, navigation, software, telemetry dropout,
                 sensor dropout, star tracker, data bus]
      structural: [structural, strut, "crack*", fatigue, "buckl*", "weld*", fastener, "delaminat*", "fractur*"]
      aerodynamic: ["aerodynamic*", max-q, max q, "buffet*", flutter, wind shear, angle of attack, dynamic pressure]
      separation: [separation, "pyrotechnic*", pyro, fairing, frangible, staging]
    # Location phrases that contain subsystem words but do not name a cause.
    neutral_phrases: [engine bay, avionics bay, engine compartment, equipment bay]
    # Sensors observing more than one subsystem (others observe only their sensor_categories entry).
    sensor_evidence:
      lox_tank_pressure: [propulsion, pressurization]
      fuel_tank_pressure: [propulsion, pressurization]
    # Directed physical couplings (cause -> effect). Only direct links count; unmapped sensors have none.
    couplings:
      pressurization: [propulsion, structural, thermal]
      propulsion: [thermal, structural, aerodynamic, pressurization]
      thermal: [structural, electrical, avionics, pressurization]
      electrical: [avionics, thermal, propulsion]
      avionics: [propulsion, aerodynamic, separation, structural]
      structural: [pressurization, propulsion, thermal, aerodynamic, electrical, separation]
      aerodynamic: [structural, thermal]
      separation: [structural, propulsion, avionics]

historical_rag:
  enabled: true
  chunk_tokens: 500
  overlap_tokens: 50
  category_boost: 0.05              # similarity bonus for cases in the leading anomaly group's category
  # dominant = only the leading group's most frequent sensor category (ties -> earliest anomaly's);
  # all = every sensor category present in the leading group.
  category_preference: dominant
  # Sensor -> knowledge-base category for the bonus (independent of LLM triage labels).
  sensor_categories:
    turbopump_vibration: propulsion
    chamber_pressure: propulsion
    fuel_tank_pressure: propulsion
    lox_tank_pressure: propulsion
    engine_bay_temp: thermal
    avionics_bus_voltage: electrical
  # Fallback for sensors not listed above: first matching glob wins.
  sensor_category_patterns:
    - ["*turbopump*", propulsion]
    - ["*chamber*", propulsion]
    - ["*injector*", propulsion]
    - ["*tank_pressure*", propulsion]
    - ["*pump_inlet*", propulsion]
    - ["*pressurant*", pressurization]
    - ["*copv*", pressurization]
    - ["*helium*", pressurization]
    - ["*ullage*", pressurization]
    - ["*regulator*", pressurization]
    - ["*voltage*", electrical]
    - ["*current*", electrical]
    - ["*battery*", electrical]
    - ["*temp*", thermal]
    - ["*thermocouple*", thermal]
    - ["*heat_flux*", thermal]
    - ["*strain*", structural]
    - ["*accel*", structural]
    - ["*imu*", avionics]
    - ["*gyro*", avionics]
    - ["*gps*", avionics]
    - ["*attitude*", avionics]
    - ["*star_tracker*", avionics]
    - ["*fin*", aerodynamic]
    - ["*dynamic_pressure*", aerodynamic]
    - ["*angle_of_attack*", aerodynamic]
    - ["*separation*", separation]
    - ["*pyro*", separation]

report_writer:
  use_llm_executive_summary: true
  llm_temperature: 0.0
  include_plots: true
  mission_name: "AeroTrace Demo Flight"
  vehicle: "Generic two-stage liquid launcher (stage 1)"
